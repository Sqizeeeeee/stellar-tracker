name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    
    - name: Build orchestrator (C++)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: stellartracker-orchestrator:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    - name: Build orbit service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./orbit-service/Dockerfile
        push: false
        tags: stellartracker-orbit-service:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    - name: Build collision service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./collision-service/Dockerfile
        push: false
        tags: stellartracker-collision-service:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    - name: Build web service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./web/Dockerfile
        push: false
        tags: stellartracker-web:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    - name: Verify built images
      run: |
        echo "=== Docker images ==="
        docker images | grep stellartracker
        
        echo ""
        echo "✅ All images built successfully"
    
    - name: Start full stack with monitoring
      run: |
        echo "🚀 Starting all services..."
        docker compose up -d
        
        echo "⏳ Waiting 30 seconds for services to initialize..."
        sleep 30
    
    - name: Check services health
      run: |
        echo "=== Container status ==="
        docker compose ps
        
        echo ""
        echo "=== Checking core services ==="
        
        # Проверяем что контейнеры запущены
        if [ "$(docker compose ps orchestrator --format json | jq -r '.State')" != "running" ]; then
          echo "❌ Orchestrator is not running"
          exit 1
        fi
        echo "✅ Orchestrator is running"
        
        if [ "$(docker compose ps orbit-service --format json | jq -r '.State')" != "running" ]; then
          echo "❌ Orbit service is not running"
          exit 1
        fi
        echo "✅ Orbit service is running"
        
        if [ "$(docker compose ps collision-service --format json | jq -r '.State')" != "running" ]; then
          echo "❌ Collision service is not running"
          exit 1
        fi
        echo "✅ Collision service is running"
        
        if [ "$(docker compose ps web --format json | jq -r '.State')" != "running" ]; then
          echo "❌ Web service is not running"
          exit 1
        fi
        echo "✅ Web service is running"
        
        echo ""
        echo "=== Checking monitoring services ==="
        
        if [ "$(docker compose ps prometheus --format json | jq -r '.State')" != "running" ]; then
          echo "❌ Prometheus is not running"
          exit 1
        fi
        echo "✅ Prometheus is running"
        
        if [ "$(docker compose ps grafana --format json | jq -r '.State')" != "running" ]; then
          echo "❌ Grafana is not running"
          exit 1
        fi
        echo "✅ Grafana is running"
    
    - name: Test service endpoints
      run: |
        echo "=== Testing service availability ==="
        
        # Ждем еще немного для полной готовности
        sleep 10
        
        # Проверяем метрики orchestrator
        if curl -f http://localhost:8000/metrics > /dev/null 2>&1; then
          echo "✅ Orchestrator metrics endpoint is accessible"
        else
          echo "⚠️ Orchestrator metrics endpoint is not ready yet"
        fi
        
        # Проверяем веб-интерфейс
        if curl -f http://localhost:5001 > /dev/null 2>&1; then
          echo "✅ Web interface is accessible"
        else
          echo "⚠️ Web interface is not ready yet"
        fi
        
        # Проверяем Prometheus
        if curl -f http://localhost:9090/-/healthy > /dev/null 2>&1; then
          echo "✅ Prometheus is healthy"
        else
          echo "❌ Prometheus is not healthy"
          exit 1
        fi
        
        # Проверяем Grafana
        if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
          echo "✅ Grafana is healthy"
        else
          echo "❌ Grafana is not healthy"
          exit 1
        fi
    
    - name: Show service logs on failure
      if: failure()
      run: |
        echo "=== Orchestrator logs ==="
        docker compose logs orchestrator --tail=50
        
        echo ""
        echo "=== Orbit service logs ==="
        docker compose logs orbit-service --tail=50
        
        echo ""
        echo "=== Collision service logs ==="
        docker compose logs collision-service --tail=50
        
        echo ""
        echo "=== Web service logs ==="
        docker compose logs web --tail=50
        
        echo ""
        echo "=== Prometheus logs ==="
        docker compose logs prometheus --tail=50
        
        echo ""
        echo "=== Grafana logs ==="
        docker compose logs grafana --tail=50
    
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up..."
        docker compose down -v
    
    - name: Move cache
      if: always()
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
