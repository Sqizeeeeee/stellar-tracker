name: CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/stellartracker

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment script
        run: |
          cat > deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          cd "$DEPLOY_PATH"
          
          # Pull latest changes
          git fetch origin
          git reset --hard origin/main
          
          # Login to registry
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          
          # Set image tag
          export TAG="${GITHUB_SHA::7}"
          export REGISTRY="ghcr.io"
          export IMAGE_PREFIX="${IMAGE_PREFIX}"
          
          # Pull latest images
          docker-compose -f docker-compose.prod.yml pull
          
          # Deploy with zero-downtime
          docker-compose -f docker-compose.prod.yml up -d --remove-orphans
          
          # Wait for services to be healthy
          sleep 15
          
          # Cleanup old images
          docker image prune -af --filter "until=24h"
          
          echo "Deployment completed successfully"
          SCRIPT
          
          chmod +x deploy.sh
      
      - name: Copy deployment script to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp deploy.sh $SERVER_USER@$SERVER_HOST:/tmp/deploy.sh
      
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          ssh $SERVER_USER@$SERVER_HOST "DEPLOY_PATH='$DEPLOY_PATH' \
            GITHUB_TOKEN='$GITHUB_TOKEN' \
            GITHUB_ACTOR='$GITHUB_ACTOR' \
            GITHUB_SHA='$GITHUB_SHA' \
            IMAGE_PREFIX='$IMAGE_PREFIX' \
            bash /tmp/deploy.sh"
      
      - name: Health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          max_retries=10
          retry_count=0
          
          while [ $retry_count -lt $max_retries ]; do
            if curl -f -s http://$SERVER_HOST/api/health > /dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            
            echo "⏳ Waiting for service to be healthy... ($((retry_count + 1))/$max_retries)"
            sleep 10
            retry_count=$((retry_count + 1))
          done
          
          echo "❌ Health check failed after $max_retries attempts"
          exit 1
      
      - name: Cleanup deployment script
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh $SERVER_USER@$SERVER_HOST "rm -f /tmp/deploy.sh" || true
      
      - name: Notify deployment success
        if: success()
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: custom
          custom_payload: |
            {
              text: '✅ Deployment successful',
              attachments: [{
                color: 'good',
                fields: [{
                  title: 'Environment',
                  value: '${{ inputs.environment || 'production' }}',
                  short: true
                }, {
                  title: 'Commit',
                  value: '${{ github.sha }}',
                  short: true
                }, {
                  title: 'Branch',
                  value: '${{ github.ref_name }}',
                  short: true
                }]
              }]
            }
      
      - name: Notify deployment failure
        if: failure()
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: custom
          custom_payload: |
            {
              text: '❌ Deployment failed',
              attachments: [{
                color: 'danger',
                fields: [{
                  title: 'Environment',
                  value: '${{ inputs.environment || 'production' }}',
                  short: true
                }, {
                  title: 'Commit',
                  value: '${{ github.sha }}',
                  short: true
                }]
              }]
            }

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    environment: ${{ inputs.environment || 'production' }}
    
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create rollback script
        run: |
          cat > rollback.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          cd "$DEPLOY_PATH"
          
          echo "🔄 Starting rollback..."
          
          # Stop current services
          docker-compose -f docker-compose.prod.yml down
          
          # Checkout previous commit
          git checkout HEAD~1
          
          # Restore previous deployment
          docker-compose -f docker-compose.prod.yml up -d
          
          echo "⏪ Rollback completed"
          SCRIPT
          
          chmod +x rollback.sh
      
      - name: Execute rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp rollback.sh $SERVER_USER@$SERVER_HOST:/tmp/rollback.sh
          ssh $SERVER_USER@$SERVER_HOST "DEPLOY_PATH='$DEPLOY_PATH' bash /tmp/rollback.sh"
          ssh $SERVER_USER@$SERVER_HOST "rm -f /tmp/rollback.sh"
      
      - name: Notify rollback
        if: always()
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: custom
          custom_payload: |
            {
              text: '⏪ Automatic rollback executed',
              attachments: [{
                color: 'warning',
                fields: [{
                  title: 'Environment',
                  value: '${{ inputs.environment || 'production' }}',
                  short: true
                }, {
                  title: 'Reason',
                  value: 'Deployment health check failed',
                  short: true
                }]
              }]
            }
