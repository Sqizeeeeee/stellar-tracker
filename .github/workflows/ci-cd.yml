name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker images
      run: |
        echo "Building Docker images..."
        docker build -t orchestrator-app .
        docker build -t orbit-service-app -f orbit-service/Dockerfile .
        docker build -t collision-service-app -f collision-service/Dockerfile .
    
    - name: Verify images
      run: |
        echo "=== Built images ==="
        docker images
        
        echo "=== Image verification ==="
        docker run --rm orchestrator-app echo "Orchestrator image OK"
        docker run --rm orbit-service-app echo "Orbit service image OK"
        docker run --rm collision-service-app echo "Collision service image OK"
    
    - name: Test with Docker Compose
      run: |
        # Используем docker compose (через пробел) вместо docker-compose
        docker compose up -d
        sleep 10
        
        echo "=== Container status ==="
        docker compose ps
        
        echo "=== Service logs ==="
        docker compose logs --tail=20
        
        echo "=== Stopping services ==="
        docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push images
      run: |
        docker build -t ghcr.io/${{ github.repository }}-orchestrator:latest .
        docker push ghcr.io/${{ github.repository }}-orchestrator:latest
        
        docker build -t ghcr.io/${{ github.repository }}-orbit:latest -f orbit-service/Dockerfile .
        docker push ghcr.io/${{ github.repository }}-orbit:latest
        
        docker build -t ghcr.io/${{ github.repository }}-collision:latest -f collision-service/Dockerfile .
        docker push ghcr.io/${{ github.repository }}-collision:latest
    
    - name: Deployment summary
      run: |
        echo "🚀 Microservices deployed to GitHub Container Registry!"
        echo "Images:"
        echo "- ghcr.io/${{ github.repository }}-orchestrator:latest"
        echo "- ghcr.io/${{ github.repository }}-orbit:latest" 
        echo "- ghcr.io/${{ github.repository }}-collision:latest"