name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Verify Docker Compose
      run: |
        echo "🔍 Checking Docker Compose availability..."
        docker compose version || { echo "❌ Docker Compose not available"; exit 1; }
    
    - name: Build orchestrator image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: orchestrator-app:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build collision service image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./collision-service/Dockerfile
        push: false
        tags: collision-service-app:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify images
      run: |
        echo "=== Built images ==="
        docker images
        
        echo "=== Image verification ==="
        docker run --rm orchestrator-app:latest echo "✅ Orchestrator image OK"
        docker run --rm collision-service-app:latest echo "✅ Collision service image OK"
    
    - name: Start services with Docker Compose
      run: |
        docker compose up -d
        echo "⏳ Waiting for services to be ready..."
        sleep 15
    
    - name: Check service health
      run: |
        echo "=== Container status ==="
        docker compose ps
        
        echo "=== Network connectivity ==="
        docker compose exec -T orchestrator ping -c 2 collision-service || echo "⚠️ Collision service not reachable"
    
    - name: Show service logs
      if: always()
      run: |
        echo "=== Orchestrator logs ==="
        docker compose logs orchestrator
        
        echo "=== Collision service logs ==="
        docker compose logs collision-service
    
    - name: Stop services
      if: always()
      run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      run: |
        echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        echo "repo_lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    
    - name: Build and push orchestrator image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-orchestrator:latest
          ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-orchestrator:${{ steps.meta.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push collision service image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./collision-service/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-collision:latest
          ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-collision:${{ steps.meta.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Deployment summary
      run: |
        echo "# 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Images pushed to GitHub Container Registry:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- \`ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-orchestrator:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-orchestrator:${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-collision:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`ghcr.io/${{ steps.meta.outputs.repo_lowercase }}-collision:${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** \`${{ steps.meta.outputs.timestamp }}\`" >> $GITHUB_STEP_SUMMARY