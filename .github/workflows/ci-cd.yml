name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install Python dependencies
      run: |
        pip install grpcio grpcio-tools
        pip install -r requirements.txt || true
    
    - name: Test collision-service Python code
      run: |
        python -m py_compile collision-service/server.py
        echo "✓ collision-service Python syntax OK"
    
    - name: Build Docker images
      run: |
        docker build -t orchestrator-app .
        docker build -t orbit-service-app -f orbit-service/Dockerfile .
        docker build -t collision-service-app -f collision-service/Dockerfile .
    
    - name: Verify Docker images and binaries
      run: |
        echo "=== Built images ==="
        docker images
        
        echo "=== Checking binaries ==="
        docker run --rm orchestrator-app which orchestrator && echo "✓ orchestrator binary exists"
        docker run --rm orbit-service-app which orbit_service && echo "✓ orbit_service binary exists"
        docker run --rm orbit-service-app which find_orb && echo "✓ find_orb binary exists"
        docker run --rm collision-service-app python --version && echo "✓ Python runtime OK"
    
    - name: Test with docker-compose
      run: |
        docker-compose up -d
        sleep 20
        
        echo "=== Container status ==="
        docker-compose ps
        
        echo "=== Health checks ==="
        if docker-compose logs orchestrator | grep -i "started\|running\|listening"; then
          echo "✓ orchestrator started"
        fi
        
        if docker-compose logs orbit-service | grep -i "started\|running\|listening"; then
          echo "✓ orbit-service started"
        fi
        
        if docker-compose logs collision-service | grep -i "started\|running\|listening"; then
          echo "✓ collision-service started"
        fi
        
        docker-compose down

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test  # Только от build-and-test, не от lint jobs
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push images
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:latest .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:latest
        
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orbit:latest -f orbit-service/Dockerfile .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orbit:latest
        
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-collision:latest -f collision-service/Dockerfile .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-collision:latest
    
    - name: Deployment summary
      run: |
        echo "🚀 Microservices deployed!"
        echo "Images available in GitHub Container Registry"