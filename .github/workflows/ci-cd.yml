name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Важно для find_orb зависимостей
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install Python dependencies
      run: |
        pip install grpcio grpcio-tools
        pip install -r requirements.txt || true
        pip install pytest docker || true
    
    - name: Test collision-service Python code
      run: |
        python -m py_compile collision-service/server.py
        echo "✓ collision-service Python syntax OK"
    
    - name: Build Docker images
      run: |
        # Собираем каждый сервис отдельно через его Dockerfile
        docker build -t orchestrator-app .
        docker build -t orbit-service-app -f orbit-service/Dockerfile .
        docker build -t collision-service-app -f collision-service/Dockerfile .
    
    - name: Verify Docker images and binaries
      run: |
        echo "=== Built images ==="
        docker images
        
        echo "=== Checking binaries ==="
        docker run --rm orchestrator-app which orchestrator && echo "✓ orchestrator binary exists"
        docker run --rm orbit-service-app which orbit_service && echo "✓ orbit_service binary exists"
        docker run --rm orbit-service-app which find_orb && echo "✓ find_orb binary exists"
        docker run --rm collision-service-app python --version && echo "✓ Python runtime OK"
    
    - name: Test with docker-compose
      run: |
        # Запускаем полный стек через docker-compose
        docker-compose up -d
        sleep 20
        
        echo "=== Container status ==="
        docker-compose ps
        
        echo "=== Health checks ==="
        # Проверяем что сервисы запустились
        timeout 30 bash -c 'until docker-compose logs orchestrator | grep -i "started\|running\|listening"; do sleep 2; done' && echo "✓ orchestrator started"
        timeout 30 bash -c 'until docker-compose logs orbit-service | grep -i "started\|running\|listening"; do sleep 2; done' && echo "✓ orbit-service started"
        timeout 30 bash -c 'until docker-compose logs collision-service | grep -i "started\|running\|listening"; do sleep 2; done' && echo "✓ collision-service started"
        
        echo "=== Process checks ==="
        docker-compose exec -T orchestrator ps aux | grep -q orchestrator && echo "✓ orchestrator process running"
        docker-compose exec -T orbit-service ps aux | grep -q orbit_service && echo "✓ orbit_service process running"
        docker-compose exec -T collision-service ps aux | grep -q python && echo "✓ collision-service Python running"
        
        echo "=== Network connectivity ==="
        # Проверяем что порты открыты
        docker-compose exec -T orchestrator nc -z orbit-service 50052 && echo "✓ orchestrator → orbit-service"
        docker-compose exec -T orchestrator nc -z collision-service 50053 && echo "✓ orchestrator → collision-service"
        
        docker-compose down

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push optimized images
      run: |
        # Собираем финальные версии образов
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:latest .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:latest
        
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orbit:latest -f orbit-service/Dockerfile .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orbit:latest
        
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-collision:latest -f collision-service/Dockerfile .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-collision:latest
    
    - name: Update deployment info
      run: |
        echo "🚀 Microservices deployed!"
        echo ""
        echo "Available images:"
        echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:latest (C++ gRPC)"
        echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orbit:latest (C++ with find_orb)"
        echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-collision:latest (Python gRPC)"
        echo ""
        echo "To update production:"
        echo "docker-compose pull && docker-compose up -d"