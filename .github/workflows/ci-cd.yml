name: Docker CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build orchestrator
      run: |
        docker build -f orchestrator/Dockerfile -t orchestrator:${{ github.sha }} .

    - name: Build orbit-service
      run: |
        docker build -f orbit-service/Dockerfile -t orbit-service:${{ github.sha }} .

    - name: Build collision-service
      run: |
        docker build -f collision-service/Dockerfile -t collision-service:${{ github.sha }} .

    - name: Test services connectivity
      run: |
        docker-compose up -d
        sleep 30
        # Check if services are responding
        timeout 30 bash -c 'until curl -f http://localhost:50051; do sleep 2; done'
        docker-compose down

  push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push orchestrator
      uses: docker/build-push-action@v5
      with:
        context: .
        file: orchestrator/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/orchestrator:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/orchestrator:${{ github.sha }}

    - name: Build and push orbit-service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: orbit-service/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/orbit-service:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/orbit-service:${{ github.sha }}

    - name: Build and push collision-service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: collision-service/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/collision-service:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/collision-service:${{ github.sha }}