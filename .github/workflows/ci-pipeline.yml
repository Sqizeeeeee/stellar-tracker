name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 orchestrator/ web/ orbit-service/ collision-service/ --count --show-source --statistics

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build all Docker images
        run: docker compose build

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build all Docker images
        run: docker compose build

      - name: Run all services
        run: |
          docker compose up -d
          sleep 30

      - name: Check all containers are running
        run: |
          docker compose ps
          for service in orchestrator orbit-service collision-service web prometheus grafana mongodb; do
            state=$(docker compose ps $service --format json | jq -r '.State')
            if [ "$state" != "running" ]; then
              echo "❌ $service is not running"
              exit 1
            fi
            echo "✅ $service is running"
          done

      - name: Test web service endpoint
        run: curl -f http://localhost:5001

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Cleanup
        if: always()
        run: docker compose down -v

  metrics:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build all Docker images
        run: docker compose build

      - name: Run all services
        run: |
          docker compose up -d
          sleep 30

      - name: Test orchestrator metrics endpoint
        run: curl -f http://localhost:8000/metrics

      - name: Test orbit-service metrics endpoint
        run: curl -f http://localhost:8002/metrics

      - name: Test collision-service metrics endpoint
        run: curl -f http://localhost:8003/metrics

      - name: Test Prometheus endpoint
        run: curl -f http://localhost:9090/-/healthy

      - name: Test Grafana endpoint
        run: curl -f http://localhost:3000/api/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Cleanup
        if: always()
        run: docker compose down -v
