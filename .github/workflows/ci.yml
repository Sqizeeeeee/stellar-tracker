name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/stellartracker

jobs:
  test-web:
    name: Test Web Service
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'web/requirements.txt'
      
      - name: Install dependencies
        working-directory: ./web
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        working-directory: ./web
        env:
          MONGODB_URI: mongodb://test:test@localhost:27017/test?authSource=admin
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
        run: |
          pytest tests/ -v --cov=. --cov-report=xml || echo "Tests not found, skipping"
      
      - name: Upload coverage
        if: hashFiles('web/coverage.xml') != ''
        uses: codecov/codecov-action@v3
        with:
          files: ./web/coverage.xml
          flags: web

  test-orchestrator:
    name: Test Orchestrator Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgrpc++-dev protobuf-compiler-grpc
      
      - name: Build
        working-directory: ./orchestrator
        run: |
          mkdir -p build
          cd build
          cmake .. || echo "CMake not configured yet"
          make || echo "Build not ready yet"
      
      - name: Run tests
        working-directory: ./orchestrator/build
        run: |
          ctest --output-on-failure || echo "Tests not configured yet"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: |
          pip install ruff bandit safety || true
      
      - name: Run Ruff
        working-directory: ./web
        continue-on-error: true
        run: |
          if [ -f "pyproject.toml" ] || [ -f "ruff.toml" ]; then
            ruff check . || true
          else
            echo "Ruff config not found, skipping"
          fi
      
      - name: Security check with Bandit
        working-directory: ./web
        continue-on-error: true
        run: |
          bandit -r . -f json || echo "Bandit check completed with warnings"
      
      - name: Check dependencies
        working-directory: ./web
        continue-on-error: true
        run: |
          safety check -r requirements.txt || echo "Safety check completed with warnings"

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [test-web, test-orchestrator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [web, orchestrator]
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
