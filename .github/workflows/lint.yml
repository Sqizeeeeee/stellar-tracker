name: Lint Python Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install ruff
      run: pip install ruff
    
    - name: Lint web service
      run: |
        echo "🔍 Linting web service..."
        ruff check web/
    
    - name: Lint orbit service
      run: |
        echo "🔍 Linting orbit service..."
        ruff check orbit-service/
    
    - name: Lint collision service
      run: |
        echo "🔍 Linting collision service..."
        ruff check collision-service/
    
    - name: Format check
      run: |
        echo "🔍 Checking Python formatting..."
        ruff format --check web/ orbit-service/ collision-service/
