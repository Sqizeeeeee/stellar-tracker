name: Code Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    name: Python Code Quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Check Python syntax
      run: |
        echo "🔍 Checking Python syntax..."
        python -m py_compile collision-service/server.py
        echo "✅ Python syntax OK"
    
    - name: Run flake8
      continue-on-error: true
      run: |
        echo "🔍 Running flake8..."
        flake8 collision-service/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 collision-service/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      continue-on-error: true
      run: |
        echo "🔍 Checking code formatting..."
        black --check collision-service/ || echo "⚠️ Code formatting could be improved"
    
    - name: Check import sorting
      continue-on-error: true
      run: |
        echo "🔍 Checking import sorting..."
        isort --check-only collision-service/ || echo "⚠️ Imports could be better organized"

  lint-go:
    runs-on: ubuntu-latest
    name: Go Code Quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache-dependency-path: |
          go.sum
          orbit-service/go.sum
    
    - name: Check Go syntax
      run: |
        echo "🔍 Checking Go syntax..."
        cd orbit-service
        go build -v ./...
        echo "✅ Go syntax OK"
    
    - name: Run go vet
      continue-on-error: true
      run: |
        echo "🔍 Running go vet..."
        cd orbit-service
        go vet ./...
    
    - name: Run go fmt
      continue-on-error: true
      run: |
        echo "🔍 Checking code formatting..."
        cd orbit-service
        test -z "$(go fmt ./...)" || echo "⚠️ Code formatting could be improved"

  lint-docker:
    runs-on: ubuntu-latest
    name: Docker Configuration
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Validate Docker Compose config
      run: |
        echo "🔍 Validating Docker Compose configuration..."
        docker compose config --quiet
        echo "✅ Docker Compose config is valid"
    
    - name: Check Dockerfiles exist
      run: |
        echo "🔍 Checking Dockerfile presence..."
        test -f Dockerfile && echo "✅ Main Dockerfile exists" || { echo "❌ Main Dockerfile missing"; exit 1; }
        test -f orbit-service/Dockerfile && echo "✅ Orbit service Dockerfile exists" || { echo "❌ Orbit Dockerfile missing"; exit 1; }
        test -f collision-service/Dockerfile && echo "✅ Collision service Dockerfile exists" || { echo "❌ Collision Dockerfile missing"; exit 1; }
    
    - name: Lint Dockerfiles with hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning
      continue-on-error: true
    
    - name: Lint orbit-service Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: orbit-service/Dockerfile
        failure-threshold: warning
      continue-on-error: true
    
    - name: Lint collision-service Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: collision-service/Dockerfile
        failure-threshold: warning
      continue-on-error: true

  validate-protobuf:
    runs-on: ubuntu-latest
    name: Protocol Buffers Validation
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
    
    - name: Validate proto files
      run: |
        echo "🔍 Validating Protocol Buffer files..."
        if [ -d proto ]; then
          find proto -name "*.proto" -exec protoc --proto_path=proto --decode_raw {} \; > /dev/null 2>&1
          echo "✅ Proto files are valid"
        else
          echo "⚠️ No proto directory found"
        fi
    
    - name: Check proto file generation
      continue-on-error: true
      run: |
        echo "🔍 Testing proto code generation..."
        if [ -f proto/astro.proto ]; then
          protoc --proto_path=proto --go_out=. --go-grpc_out=. proto/astro.proto || echo "⚠️ Go generation failed"
          protoc --proto_path=proto --python_out=. proto/astro.proto || echo "⚠️ Python generation failed"
        fi

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Full history for better secret detection
    
    - name: Scan for secrets in code
      run: |
        echo "🔍 Scanning for potential secrets..."
        
        # Check for AWS keys
        if grep -r "AKIA[0-9A-Z]\{16\}" . --exclude-dir=.git; then
          echo "❌ AWS access key found"
          exit 1
        fi
        
        # Check for OpenAI keys
        if grep -r "sk-[a-zA-Z0-9]\{20,\}" . --exclude-dir=.git; then
          echo "❌ OpenAI API key found"
          exit 1
        fi
        
        # Check for JWT tokens
        if grep -r "eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*" . --exclude-dir=.git; then
          echo "❌ JWT token found"
          exit 1
        fi
        
        # Check for generic secrets
        if grep -ri "password\s*=\s*['\"][^'\"]\+" . --exclude-dir=.git | grep -v "password.*\*\*\*"; then
          echo "⚠️ Possible hardcoded password found"
        fi
        
        echo "✅ No obvious secrets detected"
    
    - name: Check for vulnerable dependencies (Python)
      continue-on-error: true
      run: |
        echo "🔍 Checking Python dependencies..."
        if [ -f requirements.txt ]; then
          pip install safety
          safety check --file=requirements.txt || echo "⚠️ Vulnerable dependencies found"
        else
          echo "ℹ️ No requirements.txt found"
        fi
    
    - name: Check for vulnerable dependencies (Go)
      continue-on-error: true
      run: |
        echo "🔍 Checking Go dependencies..."
        if [ -f orbit-service/go.mod ]; then
          cd orbit-service
          go list -json -m all | docker run --rm -i sonatypecommunity/nancy:latest sleuth || echo "⚠️ Vulnerable dependencies found"
        else
          echo "ℹ️ No go.mod found"
        fi

  status-check:
    runs-on: ubuntu-latest
    name: Quality Gate
    needs: [lint-python, lint-go, lint-docker, validate-protobuf, security-scan]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        echo "# 📊 Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Python Lint: ${{ needs.lint-python.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Go Lint: ${{ needs.lint-go.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Lint: ${{ needs.lint-docker.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Protobuf Validation: ${{ needs.validate-protobuf.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.lint-python.result }}" != "success" ] || \
           [ "${{ needs.lint-go.result }}" != "success" ] || \
           [ "${{ needs.lint-docker.result }}" != "success" ] || \
           [ "${{ needs.security-scan.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Some checks failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **All quality checks passed!**" >> $GITHUB_STEP_SUMMARY