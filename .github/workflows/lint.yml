name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-cpp:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install C++ linters
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy cppcheck
    
    - name: Check C++ formatting
      run: |
        find orchestrator/ orbit-service/ -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
        grep -v build/ | xargs clang-format --dry-run --Werror || echo "Note: Formatting issues found"
    
    - name: Static analysis
      run: |
        cppcheck --enable=warning,performance --suppress=missingIncludeSystem \
          -I orchestrator/ -I orbit-service/ -I proto/ . 2> cppcheck.txt
        echo "CPPCheck results:"
        cat cppcheck.txt | head -20

  lint-python:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install Python linters
      run: |
        pip install flake8 black pylint
    
    - name: Check Python formatting
      run: |
        python -m black --check --diff collision-service/ || echo "Note: Formatting issues"
    
    - name: Lint Python code
      run: |
        python -m flake8 collision-service/ --max-line-length=127 --extend-ignore=E501,F821 || true

  lint-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Lint Dockerfiles
      run: |
        # Устанавливаем hadolint
        curl -L https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
        chmod +x hadolint
        
        ./hadolint Dockerfile || echo "Dockerfile lint issues"
        ./hadolint orbit-service/Dockerfile || echo "orbit-service Dockerfile lint issues"
        ./hadolint collision-service/Dockerfile || echo "collision-service Dockerfile lint issues"

  validate-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git \
          libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
          libgrpc-dev libgrpc++-dev curl wget
    
    - name: Validate proto files
      run: |
        protoc --proto_path=proto --cpp_out=test_build proto/astro.proto
        rm -rf test_build
        echo "✓ Proto files valid"
    
    - name: Check external dependencies
      run: |
        # Проверяем доступность репозиториев find_orb
        for repo in lunar jpl_eph find_orb sat_code; do
          if curl -s --head https://github.com/Bill-Gray/$repo.git | grep -q "200\|301"; then
            echo "✓ $repo available"
          else
            echo "⚠ $repo check failed"
          fi
        done

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Scan for secrets with gitleaks
      uses: gitleaks/gitleaks-action@v2
    
    - name: Basic security check
      run: |
        echo "Running basic security checks..."
        # Проверяем что нет явных секретов в коде
        if grep -r "password\|secret\|key" --include="*.py" --include="*.cpp" --include="*.h" collision-service/ orchestrator/ orbit-service/ | grep -v "test\|example"; then
          echo "⚠ Possible secrets found in code"
          exit 1
        else
          echo "✓ No obvious secrets found"
        fi