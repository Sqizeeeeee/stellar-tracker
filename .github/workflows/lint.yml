name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Check Python syntax
      run: |
        python -m py_compile collision-service/server.py
        echo "✓ Python syntax OK"

  lint-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate Docker Compose config
      run: |
        # Проверяем синтаксис docker-compose.yml
        docker compose config
        echo "✓ Docker Compose config valid"
    
    - name: Check Dockerfiles
      run: |
        echo "=== Dockerfile validation ==="
        test -f Dockerfile && echo "✓ Main Dockerfile exists"
        test -f orbit-service/Dockerfile && echo "✓ Orbit service Dockerfile exists" 
        test -f collision-service/Dockerfile && echo "✓ Collision service Dockerfile exists"

  validate-protobuf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
    
    - name: Validate proto file
      run: |
        protoc --proto_path=proto --decode_raw < proto/astro.proto > /dev/null
        echo "✓ Proto file syntax valid"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Scan for secrets
      run: |
        echo "🔍 Scanning for potential secrets..."
        # Простая проверка на явные секреты
        if grep -r "AKIA[0-9A-Z]" . || grep -r "sk-" . || grep -r "eyJ" .; then
          echo "❌ Possible secrets found"
          exit 1
        else
          echo "✅ No obvious secrets found"
        fi