name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push orchestrator
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}-orchestrator:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository }}-orchestrator:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push orbit service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./orbit-service/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}-orbit:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository }}-orbit:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push collision service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./collision-service/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}-collision:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository }}-collision:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Generate changelog
      id: changelog
      run: |
        echo "## 🚀 Release ${{ steps.version.outputs.version }}" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "### Docker Images" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "- \`ghcr.io/${{ github.repository }}-orchestrator:${{ steps.version.outputs.version }}\`" >> CHANGELOG.md
        echo "- \`ghcr.io/${{ github.repository }}-orbit:${{ steps.version.outputs.version }}\`" >> CHANGELOG.md
        echo "- \`ghcr.io/${{ github.repository }}-collision:${{ steps.version.outputs.version }}\`" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "### Changes" >> CHANGELOG.md
        git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md || echo "- Initial release" >> CHANGELOG.md
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
