version: '3.8'

services:
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-stellartracker}-web:${TAG:-latest}
    restart: always
    environment:
      - FLASK_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ORCHESTRATOR_HOST=orchestrator
      - ORCHESTRATOR_PORT=50051
    ports:
      - "5001:5000"
    depends_on:
      - mongodb
      - orchestrator
    networks:
      - stellartracker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-stellartracker}-orchestrator:${TAG:-latest}
    restart: always
    environment:
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - stellartracker

  mongodb:
    image: mongo:7
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-stellartracker}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - stellartracker
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  stellartracker:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
