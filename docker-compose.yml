services:
  # Основные сервисы приложения
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrator
    ports:
      - "50051:${ORCHESTRATOR_PORT:-50051}"
      - "${ORCHESTRATOR_METRICS_PORT:-8000}:8000"
    environment:
      - COLLISION_SERVICE_ADDR=${COLLISION_SERVICE_ADDR:-collision-service:50053}
      - ORBIT_SERVICE_ADDR=${ORBIT_SERVICE_ADDR:-orbit-service:50052}
    networks:
      - astro-net
      - monitoring
    depends_on:
      - collision-service
      - orbit-service
    command: ["orchestrator"]

  collision-service:
    build:
      context: .
      dockerfile: collision-service/Dockerfile
    container_name: collision-service
    ports:
      - "${COLLISION_SERVICE_PORT:-50053}:50053"
      - "${COLLISION_SERVICE_METRICS_PORT:-8003}:8003"
    networks:
      - astro-net
      - monitoring

  orbit-service:
    build:
      context: .
      dockerfile: orbit-service/Dockerfile
    environment:
      - OREKIT_DATA=${OREKIT_DATA:-/app/orekit-data}
      - PYTHONPATH=/app
      - JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}
    ports:
      - "${ORBIT_SERVICE_PORT:-50052}:50052"
      - "${ORBIT_SERVICE_METRICS_PORT:-8002}:8002"
    networks:
      - astro-net
      - monitoring

  # НОВЫЙ ВЕБ-ИНТЕРФЕЙС
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: stellartracker-web
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-stellartracker-secret-key}
      - ORCHESTRATOR_HOST=${ORCHESTRATOR_HOST:-orchestrator}
      - ORCHESTRATOR_PORT=${ORCHESTRATOR_PORT:-50051}
      - ORBIT_SERVICE_HOST=${ORBIT_SERVICE_HOST:-orbit-service}
      - ORBIT_SERVICE_PORT=${ORBIT_SERVICE_PORT:-50052}
      - COLLISION_SERVICE_HOST=${COLLISION_SERVICE_HOST:-collision-service}
      - COLLISION_SERVICE_PORT=${COLLISION_SERVICE_PORT:-50053}
      - PYTHONUNBUFFERED=1
    depends_on:
      - orchestrator
    networks:
      - astro-net
    restart: unless-stopped
    volumes:
      - ./web/static:/app/web/static
      - ./web/templates:/app/web/templates

  # Мониторинг - запускается через profile
  prometheus:
    image: prom/prometheus:latest
    container_name: stellartracker-prometheus
    # profiles: ["monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - astro-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: stellartracker-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-stellartracker_admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: stellartracker-loki
    # profiles: ["monitoring"]  # Закомментируй эту строку
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: stellartracker-promtail
    # profiles: ["monitoring"]  # Закомментируй эту строку
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: stellartracker-node-exporter
    # profiles: ["monitoring"]  # Закомментируй эту строку
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: stellartracker-cadvisor
    # profiles: ["monitoring"]  # Закомментируй эту строку
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
    restart: unless-stopped
    privileged: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  astro-net:
    driver: bridge
  monitoring:
    driver: bridge