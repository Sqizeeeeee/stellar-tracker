global:
  resolve_timeout: 5m

# Маршрутизация алертов
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Критические алерты - отправляются сразу
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 5m
    
    # Предупреждения - группируются
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 1h

# Receivers (получатели алертов)
receivers:
  - name: 'default'
    # Пока пустой - позже добавим Telegram
    
  - name: 'critical'
    # Критические алерты
    # Telegram будет добавлен позже
    
  - name: 'warning'
    # Предупреждения

# Подавление алертов (опционально)
inhibit_rules:
  # Если сервис down, не отправляем алерты о его метриках
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']
