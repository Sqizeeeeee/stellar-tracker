global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'stellartracker'
    environment: 'production'


alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s


rule_files:
  - '/etc/prometheus/rules/*.yml'

# Конфигурация сбора метрик
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - системные метрики хоста
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['stellartracker-node-exporter:9100']
        labels:
          service: 'node'

  # cAdvisor - метрики Docker контейнеров
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['stellartracker-cadvisor:8080']
        labels:
          service: 'containers'

  # Orchestrator 
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8000']
        labels:
          service: 'orchestrator'
          team: 'backend'
    metrics_path: '/metrics'

  # Collision Service
  - job_name: 'collision-service'
    static_configs:
      - targets: ['collision-service:8003']
        labels:
          service: 'collision-service'
          team: 'backend'
    metrics_path: '/metrics'

  # Orbit Service
  - job_name: 'orbit-service'
    static_configs:
      - targets: ['orbit-service:8002']
        labels:
          service: 'orbit-service'
          team: 'backend'
    metrics_path: '/metrics'

  # Веб-сервис
  - job_name: 'web-service'
    static_configs:
      - targets: ['web:5001']
    metrics_path: '/metrics'  # если добавишь Prometheus метрики в Flask
