groups:
  - name: stellartracker_alerts
    interval: 30s
    rules:
      # Высокое использование CPU
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "{{ $labels.service }} CPU usage is above 80% (current: {{ $value }}%)"

      # Высокое использование памяти
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.service }} memory usage is above 1GB (current: {{ $value }}MB)"

      # Сервис недоступен
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      # Высокая частота ошибок HTTP
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate"
          description: "{{ $labels.service }} error rate is above 5% (current: {{ $value }})"

      # Медленные ответы API
      - alert: SlowAPIResponse
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API responses"
          description: "{{ $labels.service }} 95th percentile response time is above 1s (current: {{ $value }}s)"

      # Collision detection проблемы
      - alert: HighCollisionDetectionTime
        expr: collision_detection_duration_seconds > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow collision detection"
          description: "Collision detection taking too long (current: {{ $value }}s)"
