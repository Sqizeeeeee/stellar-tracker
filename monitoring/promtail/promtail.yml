server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ['localhost']
        labels:
          job: orchestrator
          __path__: /logs/orchestrator/*.log

  - job_name: web
    static_configs:
      - targets: ['localhost']
        labels:
          job: web
          __path__: /logs/web/*.log

  - job_name: orbit-service
    static_configs:
      - targets: ['localhost']
        labels:
          job: orbit-service
          __path__: /logs/orbit-service/*.log

  - job_name: collision-service
    static_configs:
      - targets: ['localhost']
        labels:
          job: collision-service
          __path__: /logs/collision-service/*.log
