[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "E722",  # bare except
    "E402",  # module level import not at top of file (нужно для Orekit инициализации)
    "F401",  # imported but unused (могут быть переэкспорты)
    "F841",  # local variable assigned but never used (могут быть placeholder переменные)
    "F541",  # f-string without placeholders (для единообразия кода)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]
"**/proto/*" = ["F401"]  # автогенерированные protobuf файлы
"orbit-service/orbit_service.py" = ["E402"]  # специальная инициализация Orekit

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
