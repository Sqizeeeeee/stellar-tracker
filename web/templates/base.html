<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StellarTracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>StellarTracker</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/upload" class="{% if request.path == '/upload' %}active{% endif %}">Upload</a></li>
                <li><a href="/objects" class="{% if request.path == '/objects' %}active{% endif %}">Objects</a></li>
                <li><a href="/monitoring" class="{% if request.path == '/monitoring' %}active{% endif %}">Monitoring</a></li>
            </ul>
            <div class="user-section">
                {% if current_user.is_authenticated %}
                    <span class="username">👤 {{ current_user.username }}</span>
                    <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm">Logout</a>
                {% endif %}
            </div>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
